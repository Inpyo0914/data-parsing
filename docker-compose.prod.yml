# Financial Data Parsing Service - Docker Compose (Production)
version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.16
    container_name: financial-data-es-prod
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
      - cluster.name=financial-data-cluster
      - node.name=financial-data-node-1
    ports:
      - "9200:9200"
    volumes:
      - es_data_prod:/usr/share/elasticsearch/data
      - es_logs:/usr/share/elasticsearch/logs
    networks:
      - financial-net-prod
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 4G

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-data-web:latest
    container_name: financial-data-web-prod
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - FLASK_DEBUG=False
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
      # 프로덕션: 소스 코드 마운트 안함
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - financial-net-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-data-scheduler:latest
    container_name: financial-data-scheduler-prod
    command: python -m src.collector.scheduler
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - ES_HOST=elasticsearch
      - ES_PORT=9200
    volumes:
      - ./logs:/app/logs
      # 프로덕션: 소스 코드 마운트 안함
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - financial-net-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  es_data_prod:
    driver: local
  es_logs:
    driver: local

networks:
  financial-net-prod:
    driver: bridge
